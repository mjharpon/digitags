<!DOCTYPE html>
<!-- Gabarit de l'image de partage par défaut (1200×630), rendu par scripts/build-og-image.mjs.
     Même dessin que le logo du header : cube + « digitags » en 800 + « .work » en 600. -->
<html lang="fr">
<head>
<meta charset="UTF-8" />
<style>
  @font-face {
    font-family: 'Plus Jakarta Sans';
    font-weight: 400 800;
    src: url('../public/assets/fonts/pjs-variable.woff2') format('woff2');
  }
  html, body { margin: 0; width: 1200px; height: 630px; background: #111c3f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; gap: 36px; font-family: 'Plus Jakarta Sans', sans-serif; }
  img { width: 150px; height: 150px; }
  .name { font-size: 112px; font-weight: 800; letter-spacing: -.02em; color: #fff; line-height: 1; padding-bottom: 10px; }
  /* Bleu de marque éclairci : le #2b46f0 du header est trop sombre sur le navy. */
  .tld { font-weight: 600; color: #6f86ff; }
</style>
</head>
<body>
  <img src="../public/assets/logo-mark.svg" alt="" />
  <span class="name">digitags<span class="tld">.work</span></span>
</body>
</html>
