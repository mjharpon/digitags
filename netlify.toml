[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/admin"
  to = "/cms/"
  status = 301

[[redirects]]
  from = "/admin/*"
  to = "/cms/:splat"
  status = 301

# Page freesbiz abandonnée : redirection vers l'accueil
[[redirects]]
  from = "/freesbiz"
  to = "/"
  status = 301
